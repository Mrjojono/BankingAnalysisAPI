<!-- src/public/dashboard.html -->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orabank - Monitoring Ops</title>
    <!-- Chargement robuste de Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
      :root {
        --bg-main: #0f172a;
        --bg-sidebar: #1e293b;
        --accent: #38bdf8;
        --text-dim: #94a3b8;
        --border: #334155;
        --success: #22c55e;
        --error: #ef4444;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-main); color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }

      /* Sidebar */
      .sidebar { width: 240px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
      .sidebar-header { padding: 24px; border-bottom: 1px solid var(--border); }
      .sidebar-brand { font-weight: 800; font-size: 1.2rem; color: var(--accent); letter-spacing: -0.5px; }
      .nav-list { flex: 1; padding: 20px 0; }
      .nav-item { padding: 12px 24px; color: var(--text-dim); cursor: pointer; font-size: 0.9rem; transition: 0.2s; border-left: 3px solid transparent; }
      .nav-item:hover { background: #334155; color: #fff; }
      .nav-item.active { background: #1e293b; color: var(--accent); border-left-color: var(--accent); }

      /* Main Content */
      .main { flex: 1; display: flex; flex-direction: column; position: relative; }
      .top-bar { height: 64px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; }
      .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-dim); }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--error); position: relative; }
      .dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
      .dot.online::after { content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%; background: inherit; animation: pulse 2s infinite; }

      @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(2.5); opacity: 0; } }

      .content { flex: 1; padding: 32px; overflow-y: auto; }
      .page { display: none; animation: fadeIn 0.3s ease-out; }
      .page.active { display: block; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

      /* Components */
      .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 32px; }
      .stat-card { background: var(--bg-sidebar); padding: 24px; border-radius: 12px; border: 1px solid var(--border); }
      .stat-label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
      .stat-value { font-size: 1.8rem; font-weight: 700; margin-top: 8px; color: var(--accent); }

      .panel { background: var(--bg-sidebar); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
      .panel-header { padding: 16px 24px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border); font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
      .log-container { height: 400px; overflow-y: auto; font-family: 'Fira Code', monospace; font-size: 0.85rem; padding: 16px; background: #0c1222; }
      .log-entry { margin-bottom: 8px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; display: flex; gap: 12px; }
      .log-time { color: #475569; min-width: 80px; }
      .log-event { color: var(--accent); font-weight: 600; min-width: 140px; }
      .log-data { color: #cbd5e1; word-break: break-all; }

      .btn { background: var(--accent); color: var(--bg-main); border: none; padding: 10px 20px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; }
      .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
      .btn:active { transform: translateY(0); }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">ORABANK OPS</div>
      </div>
      <nav class="nav-list">
        <div class="nav-item active" onclick="navigate('live', this)">Flux en direct</div>
        <div class="nav-item" onclick="navigate('analytics', this)">Statistiques</div>
        <div class="nav-item" onclick="navigate('settings', this)">Configuration</div>
      </nav>
    </aside>

    <main class="main">
      <header class="top-bar">
        <h2 id="view-title">Flux en direct</h2>
        <div class="status-indicator">
          <div id="status-dot" class="dot"></div>
          <span id="status-text">Synchronisation...</span>
        </div>
      </header>

      <section class="content">
        <!-- Page: Live -->
        <div id="page-live" class="page active">
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-label">Événements Totaux</div>
              <div id="stat-events" class="stat-value">0</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Débit / sec</div>
              <div id="stat-tps" class="stat-value">0.0</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Latence Moyenne</div>
              <div class="stat-value">12ms</div>
            </div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <span>Flux temps réel des opérations</span>
              <button class="btn" style="padding: 4px 12px; font-size: 0.7rem" onclick="clearLogs()">Clear</button>
            </div>
            <div id="log-list" class="log-container">
              <div style="color: #475569; text-align: center; padding-top: 150px">Initialisation du flux...</div>
            </div>
          </div>
        </div>

        <!-- Page: Analytics -->
        <div id="page-analytics" class="page">
          <div class="panel" style="padding: 40px; text-align: center; color: var(--text-dim)">
            Analyse des comportements clients en cours de développement.
          </div>
        </div>
      </section>
    </main>

    <script>
      // Initialisation Socket.io
      // Utilisation du chemin relatif pour éviter les problèmes de port/CORS
      const socket = io();
      let eventCount = 0;
      let startTime = Date.now();

      // Gestion état connexion
      socket.on('connect', () => {
        updateStatus(true);
        pushLog('SYSTEM', 'Connexion établie avec le serveur');
      });

      socket.on('disconnect', () => {
        updateStatus(false);
        pushLog('SYSTEM', 'Connexion interrompue', 'error');
      });

      // Événements métier
      socket.on('heartbeat', (data) => {
        pushLog('HEARTBEAT', `Server Time: ${data.time}`);
      });

      socket.on('feedback_saved', (data) => {
        pushLog('CLASSIFIER', `Nouveau feedback: ${data.description} -> ${data.correctCategory}`);
        incrementEvents();
      });

      socket.on('analytics_requested', (data) => {
        pushLog('ANALYTICS', `Analyse ${data.type} pour client ${data.customerId.slice(0,8)}`);
        incrementEvents();
      });

      socket.on('transaction_created', (data) => {
        pushLog('TRANSACTION', `Nouveau ${data.type}: ${data.amount} XOF`);
        incrementEvents();
      });

      // Fonctions utilitaires UI
      function navigate(pageId, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(`page-${pageId}`).classList.add('active');
        el.classList.add('active');
        document.getElementById('view-title').textContent = el.textContent;
      }

      function updateStatus(online) {
        const dot = document.getElementById('status-dot');
        const txt = document.getElementById('status-text');
        dot.className = online ? 'dot online' : 'dot';
        txt.textContent = online ? 'Serveur en ligne' : 'Serveur hors-ligne';
      }

      function pushLog(event, message, type = '') {
        const container = document.getElementById('log-list');
        if (eventCount === 0 && container.children.length === 1) container.innerHTML = '';
        
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        const time = new Date().toLocaleTimeString('fr-FR', { hour12: false });
        
        entry.innerHTML = `
          <span class="log-time">${time}</span>
          <span class="log-event">[${event}]</span>
          <span class="log-data">${message}</span>
        `;
        
        container.prepend(entry);
        if (container.children.length > 100) container.lastChild.remove();
      }

      function incrementEvents() {
        eventCount++;
        document.getElementById('stat-events').textContent = eventCount;
        const duration = (Date.now() - startTime) / 1000;
        document.getElementById('stat-tps').textContent = (eventCount / duration).toFixed(1);
      }

      function clearLogs() {
        document.getElementById('log-list').innerHTML = '';
      }
    </script>
  </body>
</html>
